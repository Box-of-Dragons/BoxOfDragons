name: Deploy to Production

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - name: Deploy on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_PORT }}
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.PROD_PATH }}"

            echo "Fetching latest code on master..."
            git fetch origin master
            git reset --hard origin/master

            echo "Generating build info..."
            php scripts/GenerateBuildInfo.php --root=. --output=web/js/buildInfo.js --format=js
            php scripts/GenerateBuildInfo.php --root=. --output=web/changelog.html --format=html

            echo "Deploy completed."

name: Release

# Releases are always manual — Actions → Release → Run workflow.
# One action = version + tag + GitHub release + VPS deploy.
# All policy lives in the shared workflows (StructuredChaos docs/git-rules.md).

on:
  workflow_dispatch:

jobs:
  release:
    uses: Box-of-Dragons/StructuredChaos/.github/workflows/family-release.yml@master
    secrets: inherit

  deploy:
    needs: release
    if: always() && !failure() && !cancelled()
    uses: Box-of-Dragons/StructuredChaos/.github/workflows/family-deploy.yml@master
    with:
      branch: master
      environment: production
    secrets: inherit
